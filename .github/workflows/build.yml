name: Build Fogo NetHunter Kernel (5.4.302-moto-gaba9e36d0f9f)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libelf-dev libncurses5-dev libssl-dev python3 python-is-python3 zip unzip wget

      - name: Clone Exact Kernel Commit & Clang Toolchain
        run: |
          GH="https://github.com"
          git clone -b lineage-24.0 $GH/LineageOS/android_kernel_motorola_sm6375.git kernel
          cd kernel && git checkout aba9e36d0f9f && cd ..
          git clone --depth=1 $GH/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang

      - name: Apply Kali NetHunter Wi-Fi Injection Patch
        working-directory: kernel
        run: |
          GH="https://github.com"
          git clone --depth=1 $GH/wumingzhinu/kali-nethunter-kernel-patches.git nh-patches
          if [ -f nh-patches/5.4/add-wifi-injection-5.4.patch ]; then
            patch -p1 < nh-patches/5.4/add-wifi-injection-5.4.patch || true
          fi
          rm -rf nh-patches

      - name: Configure Kernel (GKI-Safe Modules =m)
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            vendor/holi-qgki_defconfig \
            vendor/ext_config/lineage_moto-holi.config

          cat << 'EOF' >> out/.config
          CONFIG_LOCALVERSION="-moto-gaba9e36d0f9f"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_SYSVIPC=y
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_MAC80211_MESH=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_ATH9K_HTC=m
          CONFIG_RT2X00=m
          CONFIG_RT2800USB=m
          CONFIG_MT7601U=m
          CONFIG_MT76x0U=m
          CONFIG_MT76x2U=m
          CONFIG_RTL8187=m
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          CONFIG_BT_HCIBTUSB=m
          CONFIG_BT_HCIUART=y
          EOF

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compile Kernel Image & Loadable Modules
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make -j$(nproc) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package Image and NetHunter .ko Modules
        run: |
          mkdir -p release/nethunter_modules
          cp kernel/out/arch/arm64/boot/Image release/
          find kernel/out -name "*.ko" -exec cp {} release/nethunter_modules/ \;
          cd release && zip -r9 ../fogo-5.4.302-nh-bundle.zip .

      - name: Upload Compiled Kernel & Modules
        uses: actions/upload-artifact@v5
        with:
          name: fogo-5.4.302-nh-bundle
          path: fogo-5.4.302-nh-bundle.zip
