name: Build Fogo NetHunter Magisk Module (5.4.302-moto-gc63a2b5a1b97)

on:
  workflow_dispatch:

jobs:
  build-magisk-module:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libelf-dev libncurses5-dev libssl-dev python3 python-is-python3 zip unzip wget

      - name: Clone Exact Running Kernel Commit & Clang Toolchain
        run: |
          GH="https://github.com"
          git clone -b lineage-24.0 $GH/LineageOS/android_kernel_motorola_sm6375.git kernel
          cd kernel && git checkout c63a2b5a1b97 && cd ..
          git clone --depth=1 $GH/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang

      - name: Apply Kali NetHunter Wi-Fi Injection Patch
        working-directory: kernel
        run: |
          GH="https://github.com"
          git clone --depth=1 $GH/wumingzhinu/kali-nethunter-kernel-patches.git nh-patches
          if [ -f nh-patches/5.4/add-wifi-injection-5.4.patch ]; then
            patch -p1 < nh-patches/5.4/add-wifi-injection-5.4.patch || true
          fi
          rm -rf nh-patches

      - name: Configure Wireless Vendor Drivers (Exact Stock CRCs)
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/holi-qgki_defconfig /vendor/ext_config/lineage_moto-holi.config

          cat << 'EOF' >> out/.config
          CONFIG_LOCALVERSION="-moto-gc63a2b5a1b97"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_LTO_NONE=y
          CONFIG_MAC80211=m
          CONFIG_MAC80211_MESH=y
          CONFIG_WLAN=y
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH_COMMON=m
          CONFIG_ATH9K_HW=m
          CONFIG_ATH9K_COMMON=m
          CONFIG_ATH9K_HTC=m
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8187=m
          CONFIG_EEPROM_93CX6=m
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=m
          CONFIG_RT2800USB=m
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=m
          CONFIG_MT76x0U=m
          CONFIG_MT76x2U=m
          CONFIG_BT_HCIBTUSB=m
          EOF

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          echo "/* stub */" > net/mac80211/rc80211_minstrel_ht.c
          grep -E "ATH9K_HTC|RTL8187|RT2800USB|MT76|MAC80211" out/.config


      - name: Compile Kernel & Adapter Modules
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make -j$(nproc) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS="-Wno-error" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package as Flashable Magisk Module Zip
        run: |
          mkdir -p magisk_mod/META-INF/com/google/android
          mkdir -p magisk_mod/modules

          find kernel/out/drivers/net/wireless -name "*.ko" -exec cp {} magisk_mod/modules/ \;
          find kernel/out/drivers/bluetooth -name "*.ko" -exec cp {} magisk_mod/modules/ \;
          cp kernel/out/drivers/misc/eeprom/eeprom_93cx6.ko magisk_mod/modules/ 2>/dev/null || true
          cp kernel/out/net/mac80211/mac80211.ko magisk_mod/modules/ 2>/dev/null || true
          cp kernel/out/net/wireless/cfg80211.ko magisk_mod/modules/ 2>/dev/null || true
          $GITHUB_WORKSPACE/clang/bin/llvm-strip --strip-debug magisk_mod/modules/*.ko

          cat << 'EOF' > magisk_mod/module.prop
          id=fogo_nh_wifi
          name=Fogo NetHunter Wi-Fi & BT Drivers (5.4.302)
          version=v1.0
          versionCode=1
          author=ArmedWithSkills
          description=Atheros ath9k_htc, Realtek rtl8187, Ralink rt2800usb, MediaTek mt76, and btusb modules for Moto G 5G (fogo) 5.4.302-moto-gc63a2b5a1b97
          EOF

          cat << 'EOF' > magisk_mod/service.sh
          #!/system/bin/sh
          MODDIR=${0%/*}
          sleep 10
          for mod in cfg80211 mac80211 eeprom_93cx6 ath ath9k_hw ath9k_common ath9k_htc rtl8187 rt2x00lib rt2x00usb rt2800lib rt2800usb mt76 mt76-usb mt76x02-lib mt76x02-usb mt7601u mt76x0u mt76x2u btintel btrtl btusb; do
            if [ -f "$MODDIR/modules/${mod}.ko" ]; then
              insmod "$MODDIR/modules/${mod}.ko" 2>/dev/null
            fi
          done
          EOF
          chmod 755 magisk_mod/service.sh

          GH="https://github.com"
          curl -sL $GH/topjohnwu/Magisk/raw/master/scripts/module_installer.sh -o magisk_mod/META-INF/com/google/android/update-binary
          echo "#MAGISK" > magisk_mod/META-INF/com/google/android/updater-script

          ls -lh magisk_mod/modules/
          cd magisk_mod && zip -r9 ../fogo-nh-wifi-magisk-module.zip .

      - name: Upload Flashable Magisk Module Zip
        uses: actions/upload-artifact@v5
        with:
          name: fogo-nh-wifi-magisk-module
          path: fogo-nh-wifi-magisk-module.zip
